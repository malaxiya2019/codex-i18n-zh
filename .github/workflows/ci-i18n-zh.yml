# CI for i18n Chinese TUI feature branch.
# Validates that the i18n changes compile and tests pass.
# Builds codex CLI binary for aarch64 linux-musl (Termux-compatible).

name: CI - i18n 中文 TUI

on:
  push:
    branches: [i18n-zh, i18n-*]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: codex-rs

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo check -p codex-tui
      - run: cargo check -p codex-cli

  test:
    name: cargo test (codex-tui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo test -p codex-tui

  build-linux-aarch64:
    name: Build aarch64 (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools crossbuild-essential-arm64
      - run: cargo build -p codex-cli --release --target aarch64-unknown-linux-musl
      - run: aarch64-linux-gnu-strip target/aarch64-unknown-linux-musl/release/codex
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-aarch64-linux-musl
          path: codex-rs/target/aarch64-unknown-linux-musl/release/codex

  build-linux-x86_64:
    name: Build x86_64 (gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build -p codex-cli --release
      - run: strip target/release/codex
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-x86_64-linux-gnu
          path: codex-rs/target/release/codex
